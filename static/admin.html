<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="robots" content="noindex" />
  <title>Админ-панель · Max English Academy</title>
  <script>document.documentElement.dataset.theme = localStorage.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="stylesheet" href="/static/ui.css" />
  <style>
    body { padding-bottom: 30px; }
    #login { max-width: 380px; margin: 10vh auto 0; padding: 0 16px; }
    #login .hero { border-radius: 30px; text-align: center; margin-bottom: 16px; }
    .stat { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--ln); }
    .stat:last-child { border-bottom: 0; }
    main { max-width: 900px; } @media (min-width: 1100px) { main { max-width: 1180px; } }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
    .lt { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .lsw { display: flex; border: 1px solid var(--ln); border-radius: 999px; overflow: hidden; background: var(--card); } .lsw button { border: 0; background: none; color: var(--mut); font: 700 12px/1 inherit; padding: 8px 10px; cursor: pointer; } .lsw button.on { background: var(--b); color: #fff; }
    header .avatar { border: 0; cursor: pointer; }
  </style>
</head>
<body>
  <div id="login" hidden>
    <div class="lt"><button type="button" data-dn data-s=".4"></button><div class="lsw" data-langsw></div></div>
    <div class="hero"><h1>Max English Academy</h1><p data-i18n="a_panel">Админ-панель</p></div>
    <form id="lf" class="box">
      <label class="f" for="lu" data-i18n="username">Логин</label><input id="lu" autocomplete="username" required />
      <label class="f" for="lp" data-i18n="password">Пароль</label><input id="lp" type="password" autocomplete="current-password" required />
      <button class="btn block" type="submit" data-i18n="a_enter">Войти</button>
    </form>
  </div>

  <div id="panel" hidden>
    <header><b id="ptitle">Админ-панель</b><a class="pill" href="/app" data-i18n="a_site">Сайт</a><button type="button" data-dn data-s=".3"></button>
      <button type="button" class="avatar sm" id="hav" onclick="go('profile')" data-aria="profile" aria-label="Profile">A</button></header>
    <main><div class="seg" id="tabs"></div><div id="v"></div></main>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/i18n.js"></script>
  <script src="/static/ui.js"></script>
  <script src="/static/profile.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
